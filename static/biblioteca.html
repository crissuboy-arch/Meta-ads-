<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad Library</title>
<style>
:root{--bg:#0E0C0A;--band:#14110D;--card:#1A150F;--line:#2E2519;--line2:#42341F;--fg:#F4EDE0;--muted:#BDAE93;--dim:#8F836F;--accent:#FF8A1F;--accent-ink:#1A0E00;--gold:#FFC857;--tint:#2A1C0C;
--display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;--body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);margin:0}
.wrap{max-width:1080px;margin-inline:auto;padding:56px 20px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h2{font:800 clamp(28px,4vw,44px)/1.05 var(--display);letter-spacing:-.02em;margin:10px 0 12px}
.lead{color:var(--muted);font-size:18px;max-width:640px;margin:0 0 24px}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
body.embedded .head{display:none}
body.embedded .wrap{padding:0}
body.embedded{overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.bar button{font:500 13px var(--mono);padding:7px 12px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{font:500 12px var(--mono);color:var(--dim);margin:12px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ad{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ad .top{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.ad .txt{padding:0 12px 12px;font-size:14px;color:var(--fg);line-height:1.45}
.art{aspect-ratio:1/1;margin:0;display:grid;place-items:center;text-align:center;padding:22px;position:relative;overflow:hidden}
.art b{font:800 clamp(22px,3.4vw,28px)/1.08 var(--display);letter-spacing:-.02em}
.art small{display:block;margin-top:10px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.art.photo{background-size:cover;background-position:center;color:#fff;align-content:end;place-items:end start;text-align:left}
.art.photo ol{margin:10px 0 0;padding-left:20px;font:600 14px/1.5 var(--body);color:#F4EDE0;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.art.photo b{text-shadow:0 2px 12px rgba(0,0,0,.6)}
.v-q{background:linear-gradient(160deg,#2A1C0C,#0E0C0A);color:var(--gold)}
.v-split{background:linear-gradient(90deg,#1F1913 50%,#2A1C0C 50%);color:var(--fg)}
.v-split::after{content:"";position:absolute;inset:0 auto 0 50%;width:2px;background:var(--accent)}
.v-quote{background:#F4EDE0;color:#1A0E00}
.v-num{background:linear-gradient(135deg,var(--accent),var(--gold));color:#1A0E00}
.v-list{background:var(--band);color:var(--fg);text-align:left;justify-items:start}
.v-list ol{margin:12px 0 0;padding-left:20px;font:600 15px/1.6 var(--body);color:var(--muted)}
.v-offer{background:#1A0E00;color:var(--fg);border:2px dashed var(--accent)}
.v-offer b{color:var(--gold)}
.v-ugc{background:linear-gradient(180deg,#3A2F20,#14110D);color:var(--fg)}
.v-cmp{background:linear-gradient(90deg,#14110D 50%,#2A1C0C 50%);color:var(--fg)}
.cta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--band);border-top:1px solid var(--line)}
.cta strong{font:700 13px var(--body);color:var(--muted);min-width:0}
.cta span{font:700 12px var(--body);background:var(--line2);padding:6px 10px;border-radius:6px;white-space:nowrap}
.act{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center;justify-content:space-between}
.act em{font:500 11px var(--mono);color:var(--dim);font-style:normal}
.act button{font:600 12px var(--body);padding:6px 10px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--fg);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{margin-top:28px;font-size:13px;color:var(--dim);max-width:70ch}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <p class="eyebrow" id="eyebrow"></p>

  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>
</div>

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function mk(id,list,get,set){var el=document.getElementById(id);el.innerHTML="";list.forEach(function(x,i){var b=document.createElement("button");b.type="button";b.textContent=x;b.setAttribute("aria-pressed",String(get()===i-1));b.onclick=function(){set(i-1);draw()};el.appendChild(b)})}
function art(a,ix){var T=a.t[L],h=esc(T[0]),k=a.k,t=T[1];
 if(IMG[ix]){return '<div class="art photo" style="background-image:linear-gradient(180deg,rgba(14,12,10,.05) 30%,rgba(14,12,10,.82)),url('+IMG[ix]+')"><div><b>'+h+'</b>'+(k==="list"?'<ol>'+t.split("\n").map(function(x){return "<li>"+esc(x.replace(/^\d\.\s*/,""))+"</li>"}).join("")+'</ol>':'')+'</div></div>'}
 if(k==="list"){var li=t.split("\n").map(function(x){return "<li>"+esc(x.replace(/^\d\.\s*/,""))+"</li>"}).join("");return '<div class="art v-list"><div><b>'+h+'</b><ol>'+li+'</ol></div></div>'}
 return '<div class="art v-'+k+'"><div><b>'+h+'</b></div></div>'}
function draw(){
 var u=UI[L];
 document.documentElement.lang=L;
 try{localStorage.setItem("lang",L)}catch(e){}
 ["eyebrow","title","lead","note"].forEach(function(k){document.getElementById(k).textContent=u[k]});
 var lb=document.getElementById("lang");lb.innerHTML="";
 LANGS.forEach(function(l){var b=document.createElement("button");b.type="button";b.textContent=l.toUpperCase();b.setAttribute("aria-pressed",String(L===l));b.onclick=function(){L=l;draw()};lb.appendChild(b)});
 mk("niche",[u.all].concat(NICHES[L]),function(){return nSel},function(x){nSel=x});
 mk("stage",[u.all].concat(STAGES[L]),function(){return sSel},function(x){sSel=x});
 var g=document.getElementById("grid");g.innerHTML="";var n=0;
 A.forEach(function(a,ix){
  if((nSel>=0&&a.n!==nSel)||(sSel>=0&&a.s!==sSel))return;n++;
  var T=a.t[L],h=T[0],t=T[1],c=T[2];
  var el=document.createElement("div");el.className="ad";
  var body=a.k==="list"?"":esc(t);
  el.innerHTML='<div class="top"><span>'+esc(NICHES[L][a.n])+'</span><span>'+esc(STAGES[L][a.s])+'</span></div><div class="txt">'+body+'</div>'+art(a,ix)+'<div class="cta"><strong>'+esc(a.st[L])+'</strong><span>'+esc(c)+'</span></div><div class="act"><em></em><button type="button">'+u.copy+'</button></div>';
  var btn=el.querySelector("button");
  btn.onclick=function(){var txt=h+"\n\n"+t+"\n\nCTA: "+c;
   function ok(){btn.textContent=u.copied;setTimeout(function(){btn.textContent=u.copy},1400)}
   try{navigator.clipboard.writeText(txt).then(ok,function(){btn.textContent=u.manual})}catch(e){btn.textContent=u.manual}};
  g.appendChild(el)});
 document.getElementById("count").textContent=n+u.of+A.length+u.ads;
}
if(new URLSearchParams(location.search).get("embed")==="1"){
document.body.classList.add("embedded");
var _sendH=function(){try{parent.postMessage({type:"libHeight",h:Math.ceil(document.documentElement.scrollHeight)},location.origin)}catch(e){}};
if("ResizeObserver" in window){new ResizeObserver(_sendH).observe(document.body)}
window.addEventListener("load",_sendH);setTimeout(_sendH,400);setTimeout(_sendH,1500);
}
(function(){
 var q=(location.search.match(/[?&]lang=(\w\w)/)||[])[1],s=null;
 try{s=localStorage.getItem("lang")}catch(e){}
 var nv=(navigator.language||"en").slice(0,2);
 L=LANGS.indexOf(q)>=0?q:LANGS.indexOf(s)>=0?s:LANGS.indexOf(nv)>=0?nv:"en";
 draw();
})();
