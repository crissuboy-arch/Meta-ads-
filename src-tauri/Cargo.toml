[package]
name = "ofensiva-trafego-ia"
version = "1.0.1"
description = "Casca desktop (Tauri) para o app web Ofensiva Tráfego IA"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[[bin]]
name = "ofensiva-trafego-ia"
path = "src/main.rs"
